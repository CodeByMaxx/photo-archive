<!DOCTYPE html>
<html>
<head>
    <title>Photo Archive</title>
</head>
<body>

<h1>Gallery</h1>

<!-- Upload form -->
<form action="/upload" method="POST" enctype="multipart/form-data">
    <input type="file" name="file">
    <button type="submit">Upload</button>
</form>

<hr>

{% for image in images %}
    <div style="margin-bottom: 20px;">
        <img src="{{ url_for('uploaded_file', filename=image) }}" width="200">

        <p>{{ image }}</p>

        <form action="{{ url_for('delete_file', filename=image) }}" method="POST">
            <button type="submit" onclick="return confirm('Delete this file?')">
                Delete
            </button>
        </form>
    </div>
{% endfor %}

</body>
</html>
